model_parameters:
  onnx_model: "/data/yolov5/runs/train/exp/weights/best.onnx"
  march: "bayes-e"
  layer_out_dump: False
  working_dir: "model_output"
  output_model_file_prefix: "yolov5s_visdrone_640x640_nv12"
  remove_node_type: "Dequantize"

input_parameters:
  input_name: ""
  input_type_rt: "nv12"
  input_type_train: "rgb"
  input_layout_train: "NCHW"
  input_shape: ""
  norm_type: "data_scale"
  mean_value: ""
  # Calibration tensors are RGB/NCHW float32 values in 0..255.
  # hb_mapper applies this scale; preprocess_640.py must not divide by 255 again.
  scale_value: 0.003921568627451

calibration_parameters:
  cal_data_dir: "/data/yolov5/calibration_data_rgb_f32"
  cal_data_type: "float32"
  calibration_type: "default"

compiler_parameters:
  compile_mode: "latency"
  debug: True
  optimize_level: "O2"
